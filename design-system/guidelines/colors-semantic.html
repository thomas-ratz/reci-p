<!-- @dsCard group="Colors" viewport="700x150" name="Kitchen semantics" subtitle="Herb = success, saffron = warning, tomato = danger" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--surface-page)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-sm);background:var(--herb-600);box-shadow:inset 0 0 0 1px oklch(0.29 0.042 48 / 0.08)"></div><div style="font:600 12px var(--font-body);color:var(--text-primary)">Herb 600</div><div style="font:400 11px var(--font-body);color:var(--text-muted)">--herb-600</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-sm);background:var(--herb-100);box-shadow:inset 0 0 0 1px oklch(0.29 0.042 48 / 0.08)"></div><div style="font:600 12px var(--font-body);color:var(--text-primary)">Herb 100</div><div style="font:400 11px var(--font-body);color:var(--text-muted)">--herb-100</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-sm);background:var(--saffron-600);box-shadow:inset 0 0 0 1px oklch(0.29 0.042 48 / 0.08)"></div><div style="font:600 12px var(--font-body);color:var(--text-primary)">Saffron 600</div><div style="font:400 11px var(--font-body);color:var(--text-muted)">--saffron-600</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-sm);background:var(--saffron-100);box-shadow:inset 0 0 0 1px oklch(0.29 0.042 48 / 0.08)"></div><div style="font:600 12px var(--font-body);color:var(--text-primary)">Saffron 100</div><div style="font:400 11px var(--font-body);color:var(--text-muted)">--saffron-100</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-sm);background:var(--tomato-600);box-shadow:inset 0 0 0 1px oklch(0.29 0.042 48 / 0.08)"></div><div style="font:600 12px var(--font-body);color:var(--text-primary)">Tomato 600</div><div style="font:400 11px var(--font-body);color:var(--text-muted)">--tomato-600</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-sm);background:var(--tomato-100);box-shadow:inset 0 0 0 1px oklch(0.29 0.042 48 / 0.08)"></div><div style="font:600 12px var(--font-body);color:var(--text-primary)">Tomato 100</div><div style="font:400 11px var(--font-body);color:var(--text-muted)">--tomato-100</div></div></div>
</body></html>

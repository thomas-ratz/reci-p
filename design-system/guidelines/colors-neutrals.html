<!-- @dsCard group="Colors" viewport="700x150" name="Cream & beige" subtitle="Page grounds and surfaces" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--surface-page)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-sm);background:var(--cream-50);box-shadow:inset 0 0 0 1px oklch(0.29 0.042 48 / 0.08)"></div><div style="font:600 12px var(--font-body);color:var(--text-primary)">Cream 50</div><div style="font:400 11px var(--font-body);color:var(--text-muted)">--cream-50</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-sm);background:var(--cream-100);box-shadow:inset 0 0 0 1px oklch(0.29 0.042 48 / 0.08)"></div><div style="font:600 12px var(--font-body);color:var(--text-primary)">Cream 100</div><div style="font:400 11px var(--font-body);color:var(--text-muted)">--cream-100</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-sm);background:var(--beige-200);box-shadow:inset 0 0 0 1px oklch(0.29 0.042 48 / 0.08)"></div><div style="font:600 12px var(--font-body);color:var(--text-primary)">Beige 200</div><div style="font:400 11px var(--font-body);color:var(--text-muted)">--beige-200</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-sm);background:var(--beige-300);box-shadow:inset 0 0 0 1px oklch(0.29 0.042 48 / 0.08)"></div><div style="font:600 12px var(--font-body);color:var(--text-primary)">Beige 300</div><div style="font:400 11px var(--font-body);color:var(--text-muted)">--beige-300</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-sm);background:var(--sand-400);box-shadow:inset 0 0 0 1px oklch(0.29 0.042 48 / 0.08)"></div><div style="font:600 12px var(--font-body);color:var(--text-primary)">Sand 400</div><div style="font:400 11px var(--font-body);color:var(--text-muted)">--sand-400</div></div></div>
</body></html>

<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../ds-loader.js"></script>
<style>body{padding:24px}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.DS;
const { Button, IconButton, Icon, Input, Select, Checkbox, Radio, Switch, Stepper, Badge, Tag, Rating, RecipeMeta, RecipeCard, IngredientList, MethodStep, ImagePlaceholder, Tabs, Dialog, Toast, Tooltip } = NS;
const Row = ({children, gap=12}) => <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap}}>{children}</div>;
const Col = ({children, gap=16}) => <div style={{display:"flex",flexDirection:"column",gap}}>{children}</div>;

function App(){ return <div style={{display:"grid",gridTemplateColumns:"1.3fr 1fr",gap:24,alignItems:"start"}}>
<div style={{background:"var(--surface-raised)",borderRadius:"var(--radius-lg)",boxShadow:"var(--shadow-lg)",padding:28,display:"flex",flexDirection:"column",gap:14}}>
<h2 style={{margin:0,font:"400 26px/1.2 var(--font-display)"}}>Save to a collection</h2>
<p style={{margin:0,color:"var(--text-secondary)"}}>Keep this recipe with others you love. You can move it any time.</p>
<Select options={["Sunday dinners","Weeknights","To try"]}/>
<Row><div style={{flex:1}}/><Button variant="ghost">Cancel</Button><Button>Save recipe</Button></Row></div>
<Col gap={28}><Toast action="Undo">Saved to Sunday dinners</Toast><Toast icon="timer">Timer done — check the oven</Toast>
<div style={{paddingTop:36}}><Tooltip content="Keeps your screen awake"><IconButton icon="sun" label="Cook mode"/></Tooltip></div></Col>
</div>; }
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>

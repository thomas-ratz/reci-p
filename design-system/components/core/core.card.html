<!-- @dsCard group="Components" viewport="700x260" name="Buttons & icons" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../ds-loader.js"></script>
<style>body{padding:24px}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.DS;
const { Button, IconButton, Icon, Input, Select, Checkbox, Radio, Switch, Stepper, Badge, Tag, Rating, RecipeMeta, RecipeCard, IngredientList, MethodStep, ImagePlaceholder, Tabs, Dialog, Toast, Tooltip } = NS;
const Row = ({children, gap=12}) => <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap}}>{children}</div>;
const Col = ({children, gap=16}) => <div style={{display:"flex",flexDirection:"column",gap}}>{children}</div>;

function App(){ const [s,setS]=React.useState(true); return <Col>
<Row><Button iconLeft="chef-hat">Start cooking</Button><Button variant="secondary">Secondary</Button><Button variant="tint" iconLeft="bookmark">Save</Button><Button variant="outline">Outline</Button><Button variant="ghost">Ghost</Button></Row>
<Row><Button size="sm">Small</Button><Button size="md">Medium</Button><Button size="lg" iconRight="arrow-right">Large</Button><Button disabled>Disabled</Button></Row>
<Row><IconButton icon="heart" label="Save" active={s} onClick={()=>setS(!s)}/><IconButton icon="share-2" label="Share"/><IconButton icon="printer" label="Print" variant="ghost"/><IconButton icon="plus" label="Add" variant="solid"/><span style={{display:"flex",gap:14,color:"var(--brown-700)"}}>{["clock","users","flame","leaf","soup","cookie","timer","utensils"].map(n=><Icon key={n} name={n} size={22}/>)}</span></Row>
</Col>; }
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>

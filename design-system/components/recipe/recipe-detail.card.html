<!-- @dsCard group="Components" viewport="700x400" name="Ingredients & method" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../ds-loader.js"></script>
<style>body{padding:24px}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.DS;
const { Button, IconButton, Icon, Input, Select, Checkbox, Radio, Switch, Stepper, Badge, Tag, Rating, RecipeMeta, RecipeCard, IngredientList, MethodStep, ImagePlaceholder, Tabs, Dialog, Toast, Tooltip } = NS;
const Row = ({children, gap=12}) => <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap}}>{children}</div>;
const Col = ({children, gap=16}) => <div style={{display:"flex",flexDirection:"column",gap}}>{children}</div>;

function App(){ const [n,setN]=React.useState(4),[d,setD]=React.useState({1:true}); return <div style={{display:"grid",gridTemplateColumns:"1fr 1.3fr",gap:32}}>
<Col><Stepper value={n} onChange={setN}/><IngredientList scale={n/4} groups={[{title:"For the sauce",items:[{qty:2,unit:"tbsp",name:"olive oil"},{qty:1,name:"onion",note:"finely diced"},{qty:0.5,unit:"tsp",name:"chilli flakes"},{qty:400,unit:"g",name:"chopped tomatoes"}]}]}/></Col>
<div>{[["Soften the onion","Cook the onion in the oil over low heat until soft and sweet, the colour of weak tea.","15 min"],["Build the sauce","Add the chilli and tomatoes. Simmer gently, stirring now and then, until thick.","20 min"]].map(([t,b,tm],i)=><MethodStep key={i} number={i+1} title={t} timer={tm} done={d[i+1]} onToggle={()=>setD(x=>({...x,[i+1]:!x[i+1]}))}>{b}</MethodStep>)}</div>
</div>; }
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>

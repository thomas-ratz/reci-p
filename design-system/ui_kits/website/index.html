<!-- @dsCard group="Website" viewport="1280x800" name="Recipe website" subtitle="Home, recipe page, search — click through" -->
<!doctype html><html><head><meta charset="utf-8"><title>Hearth — recipe website</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../ds-loader.js"></script>
<script src="data.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="RecipePage.jsx"></script>
<script type="text/babel" src="Search.jsx"></script>
<script type="text/babel">
const { Toast } = window.DS;
function App() {
  const [page, setPage] = React.useState(localStorage.getItem("hearth-page") || "home");
  const [rid, setRid] = React.useState("ragu"), [saved, setSaved] = React.useState({}), [toast, setToast] = React.useState(null);
  React.useEffect(() => { localStorage.setItem("hearth-page", page); window.scrollTo(0, 0); }, [page, rid]);
  const nav = p => setPage(p.startsWith("search") ? "search" : p);
  const open = id => { setRid(id); setPage("recipe"); };
  const toggleSave = id => setSaved(s => { const on = !s[id]; setToast(on ? "Saved to your recipe box" : "Removed from your recipe box"); clearTimeout(window.__t); window.__t = setTimeout(() => setToast(null), 2400); return { ...s, [id]: on }; });
  const props = { saved, toggleSave, onOpen: open };
  return <div>
    <Header page={page} onNav={nav} />
    {page === "home" && <Home {...props} />}
    {page === "recipe" && <RecipePage id={rid} {...props} onBack={() => setPage("search")} />}
    {page === "search" && <Search {...props} />}
    <Footer />
    {toast && <div style={{ position: "fixed", bottom: 24, left: 0, right: 0, display: "flex", justifyContent: "center", zIndex: 200 }}><Toast>{toast}</Toast></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
